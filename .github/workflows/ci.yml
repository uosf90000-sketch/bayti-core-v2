name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bayti
          POSTGRES_PASSWORD: bayti
          POSTGRES_DB: bayti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bayti -d bayti_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_POSTGRES_URL: postgresql://bayti:bayti@127.0.0.1:5432/bayti_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
